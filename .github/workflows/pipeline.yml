name: pipeline

# Re-runs the full analysis and the data-quality tests on every push, so the
# green badge in the README proves the project reproduces from scratch.
on:
  push:
  pull_request:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run pipeline
        run: python run_all.py
      - name: Run tests
        run: pytest -q
